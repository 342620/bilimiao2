name: A11y Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up JDK 17 (for grpc-generator toolchain)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build foss debug
      run: ./gradlew app:assembleFossDebug --no-daemon

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: bilimiao-foss-debug-${{ github.sha }}
        path: app/build/outputs/apk/foss/debug/*.apk
        retention-days: 14

    - name: Upload build reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports-${{ github.sha }}
        path: |
          **/build/reports/
          **/build/outputs/logs/
        retention-days: 7
