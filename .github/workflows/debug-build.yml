name: Debug Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 注意：Kotlin 2.3.0 + JDK 17 会触发 D8 解析 Kotlin metadata 失败
    # 主构建必须用 JDK 21；grpc-generator 子模块需要 JDK 17 toolchain
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up JDK 17 (for grpc-generator toolchain)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # app/signing.properties 与 app/bilimiao-debug.jks 已提交至仓库
    # (密码 12345678)，debug 构建会复用同一签名，不必卸载重装
    - name: Build foss debug
      run: ./gradlew app:assembleFossDebug --no-daemon

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: bilimiao-foss-debug-${{ github.sha }}
        path: app/build/outputs/apk/foss/debug/*.apk
        retention-days: 14

    - name: Upload build reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports-${{ github.sha }}
        path: |
          **/build/reports/
          **/build/outputs/logs/
        retention-days: 7
